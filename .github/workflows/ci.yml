name: CI

# Verifies every push and PR; publishes nothing. Releases are manual from 1.0
# (docs/DECISIONS.md). The same steps run locally as `npm run verify`.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prove the spec-drift check can fail
        run: npm run check:spec:control

      - name: Check against the live Stability OpenAPI spec
        run: npm run check:spec

      - name: Run tests
        run: npm test
